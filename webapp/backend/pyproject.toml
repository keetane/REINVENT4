[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reinvent4-web-backend"
version = "0.1.0"
description = "FastAPI and worker foundation for the REINVENT4 web application"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.143.2",
  "httpx==0.28.1",
  "pydantic==2.11.3",
  "rdkit==2024.9.6",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
]

[project.scripts]
reinvent-web-api = "app.cli:main"
reinvent-web-worker = "worker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "reinvent: model-backed smoke tests requiring an explicit runtime",
]
